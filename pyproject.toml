# This repository is a test harness, not a distributable package.
# The package under test (googletrans-curl) is installed separately via
# scripts/install_target.py; test dependencies live in requirements-test.txt.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "online: performs real network requests to Google Translate (skip with --offline)",
]
