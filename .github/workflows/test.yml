name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Version the package under test must report (empty = no version gate)"
        type: string
        default: ""

jobs:
  offline:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Install package under test (git main)
        run: python scripts/install_target.py git --allow-system
      - name: Run offline test suite
        run: python -m pytest --offline

  online:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Install package under test (git main)
        run: python scripts/install_target.py git --allow-system
      - name: Run full test suite
        if: inputs.expected_version == ''
        run: python -m pytest
      - name: Run full test suite with version gate
        if: inputs.expected_version != ''
        run: python -m pytest --expected-version ${{ inputs.expected_version }}
